[project]
name = "translator-svc"
version = "0.1.0"
description = "Real-time audio translation service: speech in, translated text and speech out."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anuj Khasgiwala" }]
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi >=0.115.11",
    "uvicorn[standard] >=0.34.0",
    "pydantic >=2.10.6",
    "pydantic-settings >=2.8.1",
    "httpx >=0.27.0",
    "python-multipart >=0.0.9",
]

[project.optional-dependencies]
# Local text-to-speech (TTS_BACKEND=kokoro_local). Also needs espeak-ng; see scripts/setup_kokoro.sh.
kokoro = ["kokoro >=0.9.2", "soundfile >=0.12.1"]
dev = [
    "pytest >=8.3.5",
    "pytest-mock",
    "black >=25.1.0,<26.0.0",
    "isort >=6.0.1,<7.0.0",
    "mypy >=1.15.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["translator_svc*"] } }

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"

[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["soundfile.*", "kokoro.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["unit: mark a test as a unit test."]
pythonpath = ["."]
testpaths = ["tests"]
